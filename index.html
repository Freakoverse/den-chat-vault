<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEN Chat Vault</title>
    <!--
      Lock the vault down hard — it has no third-party code, makes no network
      requests, and is only ever embedded by the DEN app origin.
      Tighten connect-src to 'none' once you've confirmed nothing here fetches.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://web.denchat.top;" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0b0b0d; color: #e7e7ea; }
      #selftest { max-width: 640px; margin: 0 auto; font-size: 14px; line-height: 1.6; }
      .ok { color: #34d399; } .fail { color: #f87171; } .muted { color: #9ca3af; }
      pre { white-space: pre-wrap; word-break: break-all; background: #16161a; padding: 10px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <!-- When opened top-level (not embedded), main.ts renders a feasibility self-test here. -->
    <div id="selftest"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
